<div class="floating-field">
  <input
    [id]="id()"
    [type]="type()"
    [value]="value()"
    [disabled]="isDisabled()"
    [autocomplete]="autocomplete()"
    [placeholder]="placeholder() || ' '"
    [class.floating-field__input--invalid]="invalid()"
    (input)="onInput($event)"
    (keydown)="onKeydown($event)"
    (blur)="onBlur()"
  />

  <label [for]="id()">{{ label() }}</label>
</div>
