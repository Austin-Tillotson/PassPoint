<section class="dashboard-page" aria-labelledby="dashboard-title">
  <header class="dashboard-heading">
    <div class="dashboard-heading__copy">
      <h1 id="dashboard-title">Your passwords</h1>
      <p>View and manage your saved passwords.</p>
    </div>

    <button
      #headingAddButton
      class="button button--primary dashboard-heading__add"
      type="button"
      (click)="passwordDialog.open()"
    >
      <fa-icon [icon]="faPlus" aria-hidden="true" />
      Add password
    </button>
  </header>

  @if (errorMessage()) {
    <p role="alert">{{ errorMessage() }}</p>
  }

  <app-add-password-dialog
    #passwordDialog
    (passwordSaved)="savePasswordEntry($event)"
  />

  <section class="password-grid">
    @for (entry of passwordEntries(); track entry.id) {
      <app-password-card
        [siteName]="entry.siteName"
        [password]="entry.password"
        (editRequested)="passwordDialog.open(entry)"
        (deleteRequested)="deletePasswordEntry(entry)"
      />
    }
  </section>

  @if (showFloatingAdd()) {
    <button
      class="button button--primary add-password-button"
      type="button"
      aria-label="Add password"
      title="Add password"
      (click)="passwordDialog.open()"
    >
      <fa-icon [icon]="faPlus" aria-hidden="true" />
    </button>
  }
</section>
