<app-card>
  <h2>{{ siteName() }}</h2>

  <button
    class="password-value"
    type="button"
    [attr.aria-label]="
      isPasswordVisible()
        ? 'Hide password for ' + siteName()
        : 'Show password for ' + siteName()
    "
    [attr.aria-pressed]="isPasswordVisible()"
    (click)="togglePasswordVisibility()"
  >
    {{ displayedPassword() }}
  </button>

  <div>
    <button type="button" (click)="editRequested.emit()">Edit</button>
    <button type="button" (click)="deleteRequested.emit()">Delete</button>
  </div>
</app-card>
