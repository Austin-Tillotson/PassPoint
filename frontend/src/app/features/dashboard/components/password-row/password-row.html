<div class="password-row" [class.password-row--grid]="grid()">
  <button
    class="password-row__site"
    type="button"
    [attr.aria-label]="'View details for ' + siteName()"
    (click)="detailsRequested.emit()"
  >
    <span class="password-row__icon" aria-hidden="true">
      @if (shouldShowFavicon()) {
        <img
          class="password-row__favicon"
          [src]="faviconUrl()"
          alt=""
          (error)="handleFaviconError()"
        />
      } @else {
        <fa-icon class="password-row__favicon-fallback" [icon]="faGlobe" aria-hidden="true" />
      }
    </span>

    <span class="password-row__name" [title]="displayedSiteName()">{{ displayedSiteName() }}</span>
  </button>
  <span class="password-row__folder">
    <fa-icon [icon]="faFolder" [style.color]="folderColor()" aria-hidden="true" />
    <span>{{ folderName() }}</span>
  </span>
  <div class="password-row__actions">
    <button
      class="button button--icon password-row__favorite"
      type="button"
      [attr.aria-pressed]="isFavorite()"
      [attr.aria-busy]="favoritePending()"
      [attr.aria-label]="'Favorite ' + siteName()"
      [title]="isFavorite() ? 'Remove from favorites' : 'Add to favorites'"
      [disabled]="favoritePending()"
      (click)="favoriteRequested.emit()"
    >
      <fa-icon [icon]="faStar" aria-hidden="true" />
    </button>
    <a class="button button--icon password-row__visit"
      [href]="siteUrl()" target="_blank" rel="noopener noreferrer"
      [attr.aria-label]="'Open ' + siteName() + ' in a new tab'"
      [attr.aria-disabled]="siteUrl() ? null : 'true'"
      [attr.tabindex]="siteUrl() ? null : -1"
      title="Open site in a new tab">
      <fa-icon [icon]="faGlobe" aria-hidden="true" />
    </a>
    <button
      class="button button--icon password-row__copy"
      type="button"
      [attr.aria-label]="'Copy password for ' + siteName()"
      [title]="copyMessage() || 'Copy password'"
      [attr.aria-busy]="copying()"
      [disabled]="copying()"
      (click)="copyPassword()"
    >
      <fa-icon [icon]="faCopy" aria-hidden="true" />
    </button>
    <button
      class="button button--icon password-row__details"
      type="button"
      [attr.aria-label]="'View details for ' + siteName()"
      (click)="detailsRequested.emit()"
    >
      <fa-icon [icon]="faChevronRight" aria-hidden="true" />
    </button>
  </div>
</div>
<span class="password-row__copy-status" role="status">{{ copyMessage() }}</span>
@if (copyError()) {
  <p class="password-row__error" role="alert">{{ copyError() }}</p>
}
@if (favoriteError()) {
  <p class="password-row__error" role="alert">{{ favoriteError() }}</p>
}
