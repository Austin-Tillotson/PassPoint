<dialog
  #dialog
  aria-labelledby="password-detail-title"
  (click)="onBackdropClick($event)"
  (close)="resetVisibility()"
>
  <div class="password-detail">
    <header>
      <span class="password-detail__eyebrow">Password details</span>
      <button
        class="button button--icon password-detail__quiet"
        type="button"
        aria-label="Close password details"
        title="Close"
        autofocus
        (click)="close()"
      >
        <fa-icon [icon]="faXmark" aria-hidden="true" />
      </button>
    </header>
    <div class="password-detail__identity">
      <span class="password-detail__site-icon" aria-hidden="true"
        ><fa-icon [icon]="faGlobe"
      /></span>
      <div>
        <h2 id="password-detail-title">{{ siteTitle() }}</h2>
        <p class="password-detail__url">{{ entry()?.siteName }}</p>
      </div>
    </div>
    @if (entry(); as current) {
      <dl>
        <dt>Password</dt>
        <dd class="password-detail__password">
          <code>{{ isPasswordVisible() ? current.password : '••••••••' }}</code>
          <button
            class="button button--icon password-detail__quiet"
            type="button"
            [attr.aria-pressed]="isPasswordVisible()"
            [attr.aria-label]="
              (isPasswordVisible() ? 'Hide password for ' : 'Show password for ') + current.siteName
            "
            [title]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePassword()"
          >
            <fa-icon [icon]="isPasswordVisible() ? faEyeSlash : faEye" aria-hidden="true" />
          </button>
        </dd>
        <dt>Folder</dt>
        <dd class="password-detail__folder">
          <fa-icon [icon]="faFolder" [style.color]="folderColor()" aria-hidden="true" />
          <span>{{ folderName() }}</span>
        </dd>
      </dl>
      @if (errorMessage()) {
        <p class="password-detail__error" role="alert">{{ errorMessage() }}</p>
      }
      <footer>
        <button
          class="button button--secondary password-detail__edit"
          type="button"
          [disabled]="isDeleting()"
          [attr.aria-label]="'Edit password for ' + current.siteName"
          (click)="edit(current)"
        >
          <fa-icon [icon]="faPen" aria-hidden="true" /> Edit password
        </button>
        <button
          class="button password-detail__delete"
          type="button"
          [disabled]="isDeleting()"
          [attr.aria-label]="'Delete password for ' + current.siteName"
          (click)="deleteRequested.emit(current)"
        >
          <fa-icon [icon]="faTrash" aria-hidden="true" />
          {{ isDeleting() && deletingEntryId() === current.id ? 'Deleting...' : 'Delete' }}
        </button>
      </footer>
    }
  </div>
</dialog>
