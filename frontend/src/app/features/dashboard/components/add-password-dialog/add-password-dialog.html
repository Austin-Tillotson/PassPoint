<dialog
  #dialog
  aria-labelledby="password-dialog-title"
  (click)="onBackdropClick($event)"
>
  <form
    class="password-dialog__form"
    [formGroup]="passwordForm"
    (ngSubmit)="onSubmit()"
  >
    <h2 id="password-dialog-title">
      {{ editingEntry() ? 'Edit password' : 'Add password' }}
    </h2>

    <app-floating-input
      id="site"
      label="Site"
      autocomplete="off"
      formControlName="siteName"
    />

    <app-floating-input
      id="password"
      label="Password"
      type="password"
      autocomplete="new-password"
      formControlName="password"
    />

    @if (errorMessage()) {
      <p class="password-dialog__error" role="alert">
        {{ errorMessage() }}
      </p>
    }

    <button
      class="button button--primary button--full-width"
      type="submit"
      [disabled]="isSubmitting()"
    >
      @if (isSubmitting()) {
        {{ editingEntry() ? 'Saving...' : 'Adding...' }}
      } @else {
        {{ editingEntry() ? 'Save changes' : 'Add' }}
      }
    </button>
  </form>
</dialog>
