<app-card>
  <div class="password-card">
    <div class="password-card__site">
      @if (shouldShowFavicon()) {
        <img
          class="password-card__favicon"
          [src]="faviconUrl()"
          alt=""
          (error)="handleFaviconError()"
        />
      } @else {
        <fa-icon
          class="password-card__favicon-fallback"
          [icon]="faGlobe"
          aria-hidden="true"
        />
      }

      <h2>{{ displayedSiteName() }}</h2>
    </div>

    <button
      class="password-value"
      type="button"
      [attr.aria-label]="
        isPasswordVisible()
          ? 'Hide password for ' + siteName()
          : 'Show password for ' + siteName()
      "
      [attr.aria-pressed]="isPasswordVisible()"
      (click)="togglePasswordVisibility()"
    >
      {{ displayedPassword() }}
    </button>

    <div class="password-card__actions">
      <button
        class="button button--secondary"
        type="button"
        (click)="editRequested.emit()"
      >
        Edit
      </button>

      <button
        class="button button--secondary"
        type="button"
        (click)="deleteRequested.emit()"
      >
        Delete
      </button>
    </div>
  </div>
</app-card>
