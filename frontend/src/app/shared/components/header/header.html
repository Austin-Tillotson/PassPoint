<header class="header">
  <span class="header__context">{{ pageLabel() }}</span>

  <div
    class="current-user"
    [attr.aria-label]="'Signed in as ' + (username() ?? 'User')"
  >
    <span class="current-user__initial" aria-hidden="true">
      {{ userInitial() }}
    </span>

    <div class="current-user__details">
      <span class="current-user__name" [title]="username() ?? 'User'">
        {{ username() ?? 'User' }}
      </span>
    </div>
  </div>

  <button
    #navigationToggle
    class="button button--secondary button--icon toggle-button"
    type="button"
    aria-controls="mobile-navigation"
    [attr.aria-expanded]="isNavigationOpen().toString()"
    [attr.aria-label]="isNavigationOpen() ? 'Close navigation' : 'Open navigation'"
    [attr.title]="isNavigationOpen() ? 'Close navigation' : 'Open navigation'"
    (click)="toggleNavigation()"
  >
    <fa-icon [icon]="isNavigationOpen() ? faXmark : faBars" aria-hidden="true" />
  </button>
</header>
