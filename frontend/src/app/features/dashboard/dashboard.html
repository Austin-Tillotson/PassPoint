<section class="dashboard-page" aria-labelledby="dashboard-title">
  <header class="dashboard-heading">
    <div class="dashboard-heading__copy">
      <h1 id="dashboard-title">Your passwords</h1>
      <p>View and manage your saved passwords.</p>
    </div>

    <button
      #headingAddButton
      class="button button--primary dashboard-heading__add"
      type="button"
      (click)="passwordDialog.open()"
    >
      <fa-icon [icon]="faPlus" aria-hidden="true" />
      Add password
    </button>
  </header>

  @if (errorMessage()) {
    <p role="alert">{{ errorMessage() }}</p>
  }

  <app-add-password-dialog
    #passwordDialog
    (passwordSaved)="savePasswordEntry($event)"
  />

  <app-password-detail-dialog
    [errorMessage]="errorMessage()"
    [isDeleting]="isDeleting()"
    (editRequested)="passwordDialog.open($event)"
    (deleteRequested)="deletePasswordEntry($event)"
  />

  <section class="password-list" aria-label="Saved passwords">
    <div class="password-list__heading" aria-hidden="true">
      <span>Site</span>
      <span>View</span>
    </div>
    <ul class="password-list__entries">
      @for (entry of passwordEntries(); track entry.id) {
        <li>
          <app-password-row
            [siteName]="entry.siteName"
            (detailsRequested)="openDetails(entry)"
          />
        </li>
      }
    </ul>
  </section>

  @if (showFloatingAdd()) {
    <button
      class="button button--primary add-password-button"
      type="button"
      aria-label="Add password"
      title="Add password"
      (click)="passwordDialog.open()"
    >
      <fa-icon [icon]="faPlus" aria-hidden="true" />
    </button>
  }
</section>
