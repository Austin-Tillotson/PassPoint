<main>
  <button type="button" (click)="passwordDialog.open()">
    Add password
  </button>

  @if (errorMessage()) {
    <p role="alert">{{ errorMessage() }}</p>
  }

  <app-add-password-dialog
    #passwordDialog
    (passwordSaved)="savePasswordEntry($event)"
  />

  <section class="password-grid">
    @for (entry of passwordEntries(); track entry.id) {
      <app-password-card
        [siteName]="entry.siteName"
        [password]="entry.password"
        (editRequested)="passwordDialog.open(entry)"
        (deleteRequested)="deletePasswordEntry(entry)"
      />
    }
  </section>
</main>
