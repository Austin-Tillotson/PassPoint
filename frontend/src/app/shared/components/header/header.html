<header class="header">
  <div class="header__search">
    <fa-icon
      class="header__search-icon"
      [icon]="faMagnifyingGlass"
      aria-hidden="true"
    />

    <input
      id="password-search"
      type="search"
      placeholder="Search passwords"
      aria-label="Search saved passwords"
      autocomplete="off"
    />
  </div>

  <div
    class="current-user"
    [attr.aria-label]="'Signed in as ' + (username() ?? 'User')"
  >
    <span class="current-user__initial" aria-hidden="true">
      {{ userInitial() }}
    </span>

    <span class="current-user__name">
      {{ username() ?? 'User' }}
    </span>
  </div>

  <button
    class="toggle-button"
    type="button"
    aria-controls="mobile-navigation"
    [attr.aria-expanded]="isNavigationOpen().toString()"
    [attr.aria-label]="isNavigationOpen() ? 'Close navigation' : 'Open navigation'"
    [attr.title]="isNavigationOpen() ? 'Close navigation' : 'Open navigation'"
    (click)="toggleNavigation()"
  >
    <fa-icon [icon]="faBars" aria-hidden="true" />
  </button>
</header>
