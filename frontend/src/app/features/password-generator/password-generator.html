<main class="password-generator">
  <app-card class="card--large">
    <h1>Generate Your Password</h1>

    <form class="password-generator__form" [formGroup]="generatorForm">
      <section class="password-generator__section">
        <div class="password-generator__setting">
          <div class="password-generator__setting-header">
            <label for="password-length">Password length</label>
            <span>{{ generatorForm.controls.length.value }}</span>
          </div>

          <input
            id="password-length"
            type="range"
            min="8"
            max="100"
            formControlName="length"
          />
        </div>
      </section>

      <section class="password-generator__section">
        <fieldset class="password-generator__setting">
          <legend>Allowed characters</legend>

          <div class="password-generator__choices">
            <label class="password-generator__choice">
              <input type="checkbox" formControlName="letters" />
              Letters
            </label>

            <label class="password-generator__choice">
              <input type="checkbox" formControlName="numbers" />
              Numbers
            </label>

            <label class="password-generator__choice">
              <input type="checkbox" formControlName="specialCharacters" />
              Special characters
            </label>
          </div>
        </fieldset>
      </section>

      <section class="password-generator__section">
        <fieldset class="password-generator__setting">
          <legend
            [class.password-generator__legend--muted]="
              !generatorForm.controls.letters.getRawValue()
            "
          >
            Letter case
          </legend>

          <div class="password-generator__choices">
            <label class="password-generator__choice">
              <input type="checkbox" formControlName="uppercase" />
              Uppercase
            </label>

            <label class="password-generator__choice">
              <input type="checkbox" formControlName="lowercase" />
              Lowercase
            </label>
          </div>
        </fieldset>
      </section>
    </form>

    <button
      class="button button--primary button--full-width password-generator__generate"
      type="button"
      (click)="generatePassword()"
    >
      Generate password
    </button>

    @if (generatedPassword()) {
      <output class="password-generator__result">
        {{ generatedPassword() }}
      </output>
    }
  </app-card>
</main>
