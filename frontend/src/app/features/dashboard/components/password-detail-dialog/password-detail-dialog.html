<dialog #dialog aria-labelledby="password-detail-title"
  (click)="onBackdropClick($event)" (close)="resetVisibility()">
  <div class="password-detail">
    <header>
      <h2 id="password-detail-title">Password details</h2>
      <button class="button button--secondary" type="button" autofocus (click)="close()">Close</button>
    </header>
    @if (entry(); as current) {
      <dl>
        <dt>Site</dt>
        <dd>{{ current.siteName }}</dd>
        <dt>Password</dt>
        <dd class="password-detail__password">
          <code>{{ isPasswordVisible() ? current.password : '********' }}</code>
          <button class="button button--secondary" type="button"
            [attr.aria-pressed]="isPasswordVisible()"
            [attr.aria-label]="isPasswordVisible() ? 'Hide password' : 'Show password'"
            (click)="togglePassword()">
            {{ isPasswordVisible() ? 'Hide' : 'Show' }}
          </button>
        </dd>
      </dl>
      @if (errorMessage()) {
        <p class="password-detail__error" role="alert">{{ errorMessage() }}</p>
      }
      <footer>
        <button class="button button--primary" type="button" [disabled]="isDeleting()"
          (click)="edit(current)">Edit</button>
        <button class="button button--secondary" type="button" [disabled]="isDeleting()"
          (click)="deleteRequested.emit(current)">{{ isDeleting() ? 'Deleting...' : 'Delete' }}</button>
      </footer>
    }
  </div>
</dialog>
