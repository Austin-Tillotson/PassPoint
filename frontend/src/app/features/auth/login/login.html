<main class="auth-page">
  <app-card class="card--large card--no-radius card--full-width">
    <h1>Log into PassPoint</h1>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <app-floating-input
        id="username"
        label="Username"
        autocomplete="username"
        formControlName="username"
      />

      <app-floating-input
        id="password"
        label="Password"
        type="password"
        autocomplete="current-password"
        formControlName="password"
      />

      @if (errorMessage()) {
        <p role="alert">{{ errorMessage() }}</p>
      }

      <button class="button button--primary" type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Signing in...' : 'Sign in' }}
      </button>
    </form>

    <p>
      <a class="button button--secondary button--full-width" routerLink="/register">
        Create an account
      </a>
    </p>
  </app-card>
</main>
