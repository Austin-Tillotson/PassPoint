<dialog #dialog aria-labelledby="generator-title" (click)="onBackdropClick($event)" (close)="onClosed()">
  <div class="password-generator">
    <header>
      <span class="eyebrow">Password generator</span>
      <button class="button button--icon generator-close" type="button" aria-label="Close password generator" (click)="close()">
        <fa-icon [icon]="faXmark" aria-hidden="true" />
      </button>
    </header>
    <h2 id="generator-title">A fresh password.</h2>
    <p class="intro">Choose your options and copy a password when you're ready.</p>

    <output class="password-generator__result" aria-label="Generated password" aria-live="polite">{{ generatedPassword() }}</output>

    <form [formGroup]="generatorForm">
      <div class="length-heading">
        <label for="password-length">Password length</label>
        <span>{{ generatorForm.controls.length.value }} characters</span>
      </div>
      <input id="password-length" type="range" min="8" max="100" formControlName="length" />

      <fieldset>
        <legend>Allowed characters</legend>
        <div class="choices">
          <label><input type="checkbox" formControlName="letters" /> Letters <span>Aa</span></label>
          <label><input type="checkbox" formControlName="numbers" /> Numbers <span>0–9</span></label>
          <label><input type="checkbox" formControlName="specialCharacters" /> Symbols <span>!@#</span></label>
        </div>
      </fieldset>
      <fieldset [class.is-muted]="!generatorForm.controls.letters.getRawValue()">
        <legend>Letter case</legend>
        <div class="choices choices--case">
          <label><input type="checkbox" formControlName="uppercase" /> Uppercase</label>
          <label><input type="checkbox" formControlName="lowercase" /> Lowercase</label>
        </div>
      </fieldset>
    </form>

    <footer>
      <button class="button button--secondary" type="button" (click)="generatePassword()">
        <fa-icon [icon]="faRotateRight" aria-hidden="true" /> Regenerate
      </button>
      <button class="button button--primary" type="button" [disabled]="copying() || !generatedPassword()" (click)="copyPassword()">
        <fa-icon [icon]="faCopy" aria-hidden="true" /> {{ copying() ? 'Copying…' : 'Copy password' }}
      </button>
    </footer>
    <p class="note">Generated passwords aren't saved to your vault.</p>
  </div>
  <app-toast-outlet />
</dialog>
