<section class="auth-page" aria-labelledby="login-title">
  <p class="auth-page__eyebrow">Your dashboard awaits</p>
  <h1 id="login-title">Welcome back.</h1>
  <p class="auth-page__intro">Sign in to access your pass points.</p>

  <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" [attr.aria-busy]="isSubmitting()">
    <app-floating-input [id]="'username'" label="Username" autocomplete="username" formControlName="username" />
    <app-floating-input [id]="'password'" label="Password" type="password" autocomplete="current-password" formControlName="password" />
    @if (errorMessage()) {
      <div class="auth-page__errors" role="alert"><p>{{ errorMessage() }}</p></div>
    }
    <button class="button button--primary" type="submit" [disabled]="loginForm.invalid || isSubmitting()">
      {{ isSubmitting() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>

  <section class="auth-page__demo" aria-labelledby="demo-title">
    <h2 id="demo-title">Just taking a look?</h2>
    <p>Explore your own temporary workspace with sample passwords. No sign-up needed.</p>
    <button class="button button--secondary" type="button" [disabled]="isSubmitting()" (click)="loginAsDemo()">Explore demo</button>
  </section>
  <p class="auth-page__switch">New to PassPoint? <a routerLink="/register">Create an account</a></p>
</section>
