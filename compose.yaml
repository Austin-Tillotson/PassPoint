services:
  postgres:
    image: postgres:18.4
    container_name: passpoint-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - passpoint-postgres-data:/var/lib/postgresql

volumes:
  passpoint-postgres-data: