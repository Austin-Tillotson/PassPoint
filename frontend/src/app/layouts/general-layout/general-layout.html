<app-sidebar [username]="username()" />

<main class="app-content">
  <app-header
    #header
    [username]="username()"
    [isNavigationOpen]="isMobileNavigationOpen()"
    [pageLabel]="pageLabel()"
    (navigationToggled)="toggleMobileNavigation()"
    (keydown.escape)="closeMobileNavigation(header)"
  />

  <app-mobile-navigation
    [username]="username()"
    [isOpen]="isMobileNavigationOpen()"
    (navigationClosed)="closeMobileNavigation(header)"
    (keydown.escape)="closeMobileNavigation(header)"
  />

  @if (isDemo()) {
    <aside class="demo-notice" aria-label="Demo session">
      <p><strong>Demo workspace</strong> Your changes are temporary. This session lasts up to two hours.</p>
      <button class="button button--secondary" type="button" [disabled]="resettingDemo()" (click)="resetDemo()">
        {{ resettingDemo() ? 'Resetting…' : 'Reset demo' }}
      </button>
    </aside>
  }
  <router-outlet />
</main>
<app-folder-manager />
<app-password-generator />
